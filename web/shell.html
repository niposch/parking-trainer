<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html,body { margin:0; width:100%; height:100%; height:100dvh; overflow:hidden; background:#14262b; color:#f0f0e5; font:16px system-ui,sans-serif; }
    /* Godot writes inline pixel dimensions. An old landscape width must not
       enlarge the portrait layout viewport and make all UI appear shrunken. */
    html,body { max-width:100vw; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
    canvas { display:block; width:100vw !important; height:100dvh !important; max-width:100vw; max-height:100dvh; outline:none; touch-action:none; }
    #loading { position:fixed; inset:0; display:grid; place-content:center; gap:16px; text-align:center; padding:24px; }
    h1 { font-size:28px; margin:0; } progress { width:min(400px,80vw); accent-color:#cff59f; }
    #error { white-space:pre-wrap; max-width:650px; } #checks { position:fixed; bottom:8px; left:8px; padding:10px; background:#14262b; color:#cff59f; max-width:90vw; font-size:13px; }
    [hidden] { display:none !important; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Parking Practice game"></canvas>
  <div id="loading" role="status"><h1>Parking Practice</h1><span id="message">Loading the parking lot…</span><progress id="progress"></progress><div id="error"></div></div>
  <pre id="checks" hidden></pre>
  <noscript>Enable JavaScript to play Parking Practice.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    // Use the full visual viewport as the address bar changes height.
    const config = $GODOT_CONFIG;
    const checking = new URLSearchParams(location.search).has('check');
    if (checking) config.args = ['--', '--web-check'];
    const engine = new Engine(config);
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const results = document.getElementById('checks');
    function fail(error) {
      console.error(error);
      loading.hidden = false;
      document.getElementById('message').textContent = 'Unable to start the game';
      document.getElementById('error').textContent = String(error?.message || error);
      progress.hidden = true;
    }
    async function start() {
    const missing = Engine.getMissingFeatures({threads:true});
    if (missing.length && config.serviceWorker && config.ensureCrossOriginIsolationHeaders && 'serviceWorker' in navigator && !navigator.serviceWorker.controller) {
      document.getElementById('message').textContent = 'Preparing browser support…';
      await engine.installServiceWorker();
      await navigator.serviceWorker.ready;
      location.reload();
      return;
    }
    if (missing.length) fail('Your browser or host is missing: ' + missing.join(', ') + '. Use a current desktop browser and HTTPS (or the local test server).');
    else engine.startGame({
      onProgress(current,total) { if(total) { progress.max=total; progress.value=current; } },
      onPrint(...args) {
        console.log(...args);
        const text=args.join(' ');
        if(checking && /WEB (COMPLETE|FAILED)/.test(text)) { results.hidden=false; results.textContent=text; }
      },
      onPrintError(...args) {
        console.error(...args);
        if(checking && args.join(' ').includes('WEB FAILED')) { results.hidden=false; results.textContent=args.join(' '); }
      }
    }).then(()=>{ loading.hidden=true; },fail);
    }
    start().catch(fail);
  </script>
</body>
</html>
