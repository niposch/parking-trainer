name: Build and deploy parking trainer
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install browser regression tooling
        run: |
          npm install --no-save --prefix .cache/web-tests playwright@1.64.1
          node .cache/web-tests/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify cached-browser deployment updates
        run: node --test tools/test-web-updates.cjs
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: toolchain
        with:
          path: .cache/web-toolchain
          key: parking-web-windows-godot4.7.2-dotnet9.0.319-v1
      - name: Build C# web export
        shell: pwsh
        run: |
          if ('${{ steps.toolchain.outputs.cache-hit }}' -eq 'true') { ./build-web.ps1 }
          else { ./build-web.ps1 -Setup }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: builds/web
  deploy:
    needs: [build, updates]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
